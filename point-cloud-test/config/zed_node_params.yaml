zed_pcl_proc_node:
  ros__parameters:
    use_odom_pcl_pair: false
    voxel_size: 0.3
    max_pcl_points: 500000
    callback_time: 500
    clustering_params:
      method: 1 # 0 is RegionGrowing, 1 is EuclideanCluster
      euclidean_clustering:
        max_z_mean: 0.4
        max_z_variance: 0.1 
        distance_tolerance: 1.0
      region_growing:
        max_degrees: 3.0
        curvature_threshold: 1.0