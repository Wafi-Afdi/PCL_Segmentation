obstacle_det_pcl_proc_node:
  ros__parameters:
    use_sim_time: true # Jadikan ini false ketika tidak main simulasi/ros2 bag
    is_sim: false # Jadikan ini false ketika tidak main di simulasi
    use_odom_pcl_pair: true
    voxel_size: 0.3
    max_pcl_points: 350000
    callback_time: 500
    cloud_history_seconds: 10.0 # Rolling observation window 
    max_history_clouds: 200
    is_log_enabled: true
    lidar_min_dist_thresh: 0.1
    lidar_max_dist_thresh: 10.0
    is_lidar: true
    max_pcl_odom_pair: 10
    odom_type: sensor
    pose_type: sensor
    pcl_type: sensor
    clustering:
      max_points: 50 # Maksimum voxel point di cluster sebelum di split
      min_points: 2
      distance_thresh: 0.4 # Distance thresh untuk clustering
      split_cluster_threshold: 20 # Split ketika ellipsoid menutupi setidaknya 20 voxel
      ellipsoid_extended_radii: 1.7320508 # Memastikan ellipsoid cover semua voxel
    output_frame: odom
    map_frame: odom
    ground_removal:
      method: 1 # 0 is PMF, 1 is RANSAC, -1 No Ground Removal

bb_pcl_proc_node:
  ros__parameters:
    use_sim_time: true # Jadikan ini false ketika tidak main simulasi/ros2 bag
    map_frame: odom
    use_odom_pcl_pair: false
    voxel_size: 0.3
    max_pcl_points: 500000
    callback_time: 500
    object_label_target: 
      - "pohon"
      - "bunga"
    clustering_params:
      method: 1 # 0 is RegionGrowing, 1 is EuclideanCluster
      euclidean_clustering:
        max_z_mean: 0.2
        max_z_variance: 0.1 
        distance_tolerance: 1.0
      region_growing:
        max_degrees: 10.0
        curvature_threshold: 2.0
    ground_removal:
      method: 1 # 0 is PMF, 1 is RANSAC