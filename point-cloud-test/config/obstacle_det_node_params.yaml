obstacle_det_pcl_proc_node:
  ros__parameters:
    use_sim_time: true
    is_sim: true
    use_odom_pcl_pair: false
    voxel_size: 0.3
    max_pcl_points: 350000
    callback_time: 500
    is_log_enabled: true
    clustering:
      max_points: 80
      min_points: 2
      distance_thresh: 0.7
      ellipsoid_extended_radii: 1.7320508
    output_frame: "map"
    ground_removal:
      method: 1 # 0 is PMF, 1 is RANSAC

bb_pcl_proc_node:
  ros__parameters:
    use_odom_pcl_pair: false
    voxel_size: 0.3
    max_pcl_points: 500000
    callback_time: 500
    object_label_target: 
      - "pohon"
      - "bunga"
    clustering_params:
      method: 1 # 0 is RegionGrowing, 1 is EuclideanCluster
      euclidean_clustering:
        max_z_mean: 0.2
        max_z_variance: 0.1 
        distance_tolerance: 1.0
      region_growing:
        max_degrees: 10.0
        curvature_threshold: 2.0
    ground_removal:
      method: 1 # 0 is PMF, 1 is RANSAC